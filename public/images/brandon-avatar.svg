    <path d="M166 246 L166 320 Q200 340 234 320 L234 246 Z" fill="#a96650" stroke="#0f2236" stroke-width="4" stroke-linejoin="round"/>
    <!-- camisa de playa -->
    <path d="M8 400 C 20 352, 84 322, 150 312 L 200 372 L 250 312 C 316 322, 380 352, 392 400 Z" fill="#ffc83d" stroke="#0f2236" stroke-width="4" stroke-linejoin="round"/>
    <g clip-path="url(#av-shirt-clip)">
