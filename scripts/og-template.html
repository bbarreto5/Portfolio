<!doctype html>
<!-- Plantilla de la imagen Open Graph (1200×630). La renderiza scripts/generate-og.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'JBM';
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
      }
      :root {
        --ink: #0f2236;
        --cream: #fffaf0;
        --sky: #a6ecf2;
        --sun: #ffc83d;
        --coral: #ff6a4d;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--sky);
        font-family: 'Bricolage', sans-serif;
        color: var(--ink);
      }
      .sea { position: absolute; inset: 0; }
      .sun {
        position: absolute; right: 250px; top: 40px; width: 170px; height: 170px; border-radius: 50%;
        background: radial-gradient(circle, #ffe28a 0 52%, var(--sun) 53%); border: 5px solid var(--ink);
      }
      .copy { position: absolute; left: 64px; top: 58px; width: 760px; }
      .pill {
        display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 12px;
        background: var(--cream); border: 4px solid var(--ink); border-radius: 999px; box-shadow: 4px 4px 0 var(--ink);
        font-weight: 700; font-size: 22px;
      }
      .pill i { width: 18px; height: 18px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ink); }
      h1 {
        margin-top: 26px; font-size: 104px; line-height: 0.9; letter-spacing: -0.035em; font-weight: 800;
        color: var(--cream); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--ink);
      }
      .role { margin-top: 26px; font-family: 'JBM', monospace; font-size: 21px; white-space: nowrap; font-weight: 600; }
      .porthole {
        position: absolute; right: 70px; top: 120px; width: 250px; height: 250px; border-radius: 50%;
        background: var(--sun); border: 6px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 18px;
      }
      .porthole div {
        width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center;
        background: url('../public/images/brandon-avatar.svg') center / cover, linear-gradient(160deg, #7fe3d4 0 48%, #14b8b0 48% 70%, #1769aa 70%);
        font-size: 78px; font-weight: 800; color: var(--cream); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
      }
      .url {
        position: absolute; right: 64px; bottom: 40px; padding: 8px 16px; background: var(--ink); color: var(--cream);
        border-radius: 10px; font-family: 'JBM', monospace; font-size: 20px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg class="sea" viewBox="0 0 1200 630" preserveAspectRatio="none">
      <path d="M0 420 L1200 250 V630 H0Z" fill="#c9f5ec" />
      <path d="M0 455 L1200 285 V630 H0Z" fill="#7fe3d4" />
      <path d="M0 490 L1200 320 V630 H0Z" fill="#14b8b0" />
      <path d="M0 490 L1200 320" stroke="#fffaf0" stroke-width="6" />
      <path d="M0 525 L1200 355 V630 H0Z" fill="#0e9aa7" />
      <path d="M0 560 L1200 390 V630 H0Z" fill="#1769aa" />
      <path d="M0 560 L1200 390" stroke="#fffaf0" stroke-width="6" />
      <path d="M0 595 L1200 425 V630 H0Z" fill="#0f4f86" />
      <path d="M0 630 L1200 460 V630 H0Z" fill="#0b3a5b" />
      <g stroke="#0f2236" stroke-width="4" stroke-linejoin="round">
        <ellipse cx="930" cy="520" rx="200" ry="34" fill="#c9f5ec" />
        <path d="M770 518 C 820 482, 1040 478, 1090 516 C 1050 540, 810 544, 770 518Z" fill="#f6e2b3" />
        <rect x="900" y="430" width="100" height="70" fill="#ff8fa3" />
        <path d="M888 434 L950 388 L1012 434Z" fill="#1769aa" />
        <rect x="912" y="446" width="44" height="32" rx="3" fill="#0f2236" />
        <rect x="968" y="452" width="20" height="48" fill="#c9773f" />
        <path d="M840 512 C 838 470, 846 440, 858 410" fill="none" stroke-width="9" stroke="#c9773f" />
        <path d="M858 410 c 26 -18 52 -10 62 6 c -22 -4 -40 -4 -62 -6Z M858 410 c -24 -18 -50 -8 -58 10 c 18 -6 36 -8 58 -10Z M858 410 c 8 -26 26 -38 42 -36 c -16 10 -28 22 -42 36Z" fill="#3fbf6e" />
      </g>
      <g font-family="JBM, monospace" font-weight="600" font-size="34" fill="#fffaf0" opacity="0.75">
        <text x="560" y="70" transform="rotate(8 560 70)">&lt;/&gt;</text>
        <text x="1110" y="70" transform="rotate(-10 1110 70)">{ }</text>
        <text x="640" y="250" transform="rotate(-6 640 250)">=&gt;</text>
      </g>
    </svg>
    <div class="sun"></div>
    <div class="copy">
      <span class="pill"><i></i>{{eyebrow}}</span>
      <h1>Brandon<br />Barreto Lozano</h1>
      <p class="role">{{role}}</p>
    </div>
    <div class="porthole"><div></div></div>
    <span class="url">{{url}}</span>
  </body>
</html>
